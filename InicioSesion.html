<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Iván Rodríguez Gómez-Landero">
        <link rel="stylesheet" href="estilos.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Encode+Sans+SC:wght@100..900&display=swap" rel="stylesheet">
        <title>Inicio de Sesión</title>
    </head>
    <body>
        
        <!-- Imagen -->
        <header>
            <img src="foto.png" alt="Jesuitas.png">
        </header>

        <!-- Titulo -->
        <h1><span class="mayuscula">A</span>GRADECE <span id="EN">EN</span> <span class="mayuscula">C</span>OMPAÑÍA</h1>
        
        <!-- Linea -->
        <hr id="linea1">

        <!-- Formulario -->
        <form class="formulario">

            <!-- Leyenda -->
            <h3 class="Leyenda">Iniciar sesión para continuar</h3>
            <hr id="linea1">

            <!-- Correo -->
            <label for="Correo">Correo electrónico:</label><br>
            <input type="email" id="Correo" name="Correo" placeholder="📩 tu@email.com" required><br><br>

            <!-- Contraseña -->
            <label for="password">Contraseña:</label><br>
            <input type="password" id="password" name="password" placeholder="🔒 Ingresa tu contraseña" required><br><br>

            <!-- Botón de envío -->
            <input type="submit" value="Enviar" id="Enviar">

        </form>
    </body>
</html>
